version: "3.9"
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://mongo:27017/suqaq
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - FRONTEND_ORIGIN=https://souqak-yem.com,https://www.souqak-yem.com,http://localhost:5173
      - VITE_SOCKET_URL=https://api.souqak-yem.com
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_EMAIL=${VAPID_EMAIL}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - EMAIL_USER_1=${EMAIL_USER_1:-}
      - EMAIL_PASS_1=${EMAIL_PASS_1:-}
      - EMAIL_USER_2=${EMAIL_USER_2:-}
      - EMAIL_PASS_2=${EMAIL_PASS_2:-}
      - EMAIL_USER_3=${EMAIL_USER_3:-}
      - EMAIL_PASS_3=${EMAIL_PASS_3:-}
      - EMAIL_USER_4=${EMAIL_USER_4:-}
      - EMAIL_PASS_4=${EMAIL_PASS_4:-}
      - EMAIL_USER_5=${EMAIL_USER_5:-}
      - EMAIL_PASS_5=${EMAIL_PASS_5:-}
      - EMAIL_USER_6=${EMAIL_USER_6:-}
      - EMAIL_PASS_6=${EMAIL_PASS_6:-}
      - EMAIL_USER_7=${EMAIL_USER_7:-}
      - EMAIL_PASS_7=${EMAIL_PASS_7:-}
      - EMAIL_USER_8=${EMAIL_USER_8:-}
      - EMAIL_PASS_8=${EMAIL_PASS_8:-}
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  mongo_data:

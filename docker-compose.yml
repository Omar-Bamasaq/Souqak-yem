version: "3.9"
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://mongo:27017/suqaq
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - FRONTEND_ORIGIN=http://localhost:5173
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
    depends_on:
      - mongo
volumes:
  mongo_data:


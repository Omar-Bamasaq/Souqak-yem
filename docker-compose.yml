services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the repository-root .env}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the repository-root .env}"
      MONGO_INITDB_DATABASE: suqaq
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo-provision:
    image: souqak-backend:local
    command: ["node", "docker/mongo-provision.js"]
    restart: "no"
    network_mode: "service:mongo"
    environment:
      MONGO_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the repository-root .env}"
      MONGO_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the repository-root .env}"
      MONGO_APP_USERNAME: "${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in the repository-root .env}"
      MONGO_APP_PASSWORD: "${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in the repository-root .env}"
      MONGO_HOST: 127.0.0.1
    depends_on:
      mongo:
        condition: service_healthy

  backend:
    image: souqak-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: souqak-backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: "mongodb://${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in the repository-root .env}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in the repository-root .env}@mongo:27017/suqaq?authSource=suqaq"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in the repository-root .env}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the repository-root .env}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in the repository-root .env}"
      FRONTEND_URL: "${FRONTEND_URL:-https://souqak-yem.com}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_EMAIL: "${VAPID_EMAIL:-}"
      EMAIL_USER: "${EMAIL_USER:-}"
      EMAIL_PASS: "${EMAIL_PASS:-}"
      EMAIL_USER_1: "${EMAIL_USER_1:-}"
      EMAIL_PASS_1: "${EMAIL_PASS_1:-}"
      EMAIL_USER_2: "${EMAIL_USER_2:-}"
      EMAIL_PASS_2: "${EMAIL_PASS_2:-}"
      EMAIL_USER_3: "${EMAIL_USER_3:-}"
      EMAIL_PASS_3: "${EMAIL_PASS_3:-}"
      EMAIL_USER_4: "${EMAIL_USER_4:-}"
      EMAIL_PASS_4: "${EMAIL_PASS_4:-}"
      EMAIL_USER_5: "${EMAIL_USER_5:-}"
      EMAIL_PASS_5: "${EMAIL_PASS_5:-}"
      EMAIL_USER_6: "${EMAIL_USER_6:-}"
      EMAIL_PASS_6: "${EMAIL_PASS_6:-}"
      EMAIL_USER_7: "${EMAIL_USER_7:-}"
      EMAIL_PASS_7: "${EMAIL_PASS_7:-}"
      EMAIL_USER_8: "${EMAIL_USER_8:-}"
      EMAIL_PASS_8: "${EMAIL_PASS_8:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads_data:/app/uploads
      - private_uploads_data:/app/private_uploads
    depends_on:
      mongo:
        condition: service_healthy
      mongo-provision:
        condition: service_completed_successfully

volumes:
  mongo_data:
  uploads_data:
  private_uploads_data:

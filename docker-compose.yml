version: "3.9"
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://mongo:27017/suqaq
      - JWT_SECRET=${JWT_SECRET:-dev_secret_key_change_this_in_production_12345}
      - FRONTEND_ORIGIN=https://souqak-yem.com,https://www.souqak-yem.com,http://localhost:5173
      - VITE_SOCKET_URL=https://api.souqak-yem.com
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_EMAIL=${VAPID_EMAIL}
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
    depends_on:
      - mongo
volumes:
  mongo_data:

